server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  ai:
    dashscope:
      api-key: ${ALIYUN-BAILIAN-ACCESS-KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  # 默认是https://dashscope.aliyuncs.com
      chat:
        options:
#          model: deepseek-v3.2-exp # 如未配置，默认是qwen-plus com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatProperties.getOptions
          model: qwen3-max
  application:
    name: saa-01helloworld
