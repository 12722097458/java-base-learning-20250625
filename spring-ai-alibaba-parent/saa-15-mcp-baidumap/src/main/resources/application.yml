server:
  port: 8015
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  ai:
    dashscope:
      api-key: ${ALIYUN-BAILIAN-ACCESS-KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3-max
    mcp:
      client:
        enabled: true
        stdio:
          servers-configuration: classpath:/baidumap.json

  application:
    name: saa-15-mcp-baidumap
