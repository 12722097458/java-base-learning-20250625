server:
  port: 8010
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  ai:
    dashscope:
      api-key: ${ALIYUN-BAILIAN-ACCESS-KEY}
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      embedding:
        options:
          model: text-embedding-v1
      chat:
        options:
          model: qwen3-max
    vectorstore:
      redis:
        initialize-schema: true
        index-name: my-default-index
        prefix: my-custom-prefix

  data:
    redis:
      host: 192.168.137.110
      port: 6379
  application:
    name: saa-10embed2vector

