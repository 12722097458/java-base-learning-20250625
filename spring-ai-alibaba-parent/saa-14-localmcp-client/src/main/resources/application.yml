server:
  port: 8014
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  ai:
    dashscope:
      api-key: ${ALIYUN-BAILIAN-ACCESS-KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3-max
    mcp:
      client:
        enabled: true
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          connections:
            my-weather-mcp-server:
              url: http://localhost:8013

  application:
    name: saa-14-localmcp-client
